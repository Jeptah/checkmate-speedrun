<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Checkmate Speedrun</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Checkmate Speedrun</h1>
      <div class="options">
        <select id="set" aria-label="Pieces"></select>
        <select id="start" aria-label="Starting position"></select>
        <label class="toggle" title="Hover a square and press a piece key to move there">
          <input type="checkbox" id="keys"> Keys
        </label>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><span id="time">0.00</span><label>seconds</label></div>
      <div class="stat"><span id="moves">0</span><label>moves</label></div>
      <div class="stat best"><span id="best">–</span><label>best</label></div>
    </div>

    <div id="board" class="board">
      <div id="squares"></div>
      <div id="pieces"></div>
      <div id="resize" class="resize" title="Drag to resize, double-click to reset"></div>
      <div id="overlay" class="overlay" hidden></div>
    </div>

    <div class="footer">
      <p id="status"></p>
      <button id="new" type="button">New position <kbd class="no-keys">Space</kbd><kbd class="with-keys">R</kbd></button>
    </div>
    <p id="keyhelp" class="keyhelp">
      Hover a square, then:
      <kbd>W</kbd> pawn <kbd>Q</kbd><kbd>E</kbd> pawn takes left / right
      <kbd>S</kbd> queen <kbd>Shift</kbd> king <kbd>A</kbd><kbd>D</kbd> left / right knight
      <kbd>1</kbd><kbd>3</kbd> left / right rook <kbd>Space</kbd> bishop
    </p>
    <ol id="movelist"></ol>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
